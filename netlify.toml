# CICMELINST - Netlify Configuration
# netlify.toml

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION = "10"

[[headers]]
  for = "/*"
  values = { X-Frame-Options = "DENY", X-Content-Type-Options = "nosniff", Referrer-Policy = "strict-origin-when-cross-origin", Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), xr-spatial-tracking=()" }

[[headers]]
  for = "/assets/*"
  values = { Cache-Control = "public, max-age=31536000, immutable" }

[[headers]]
  for = "/images/*"
  values = { Cache-Control = "public, max-age=2592000, immutable" }

[[headers]]
  for = "/logos/*"
  values = { Cache-Control = "public, max-age=2592000, immutable" }

[[headers]]
  for = "/sw.js"
  values = { Cache-Control = "public, max-age=0, must-revalidate", Service-Worker-Allowed = "/" }

[[headers]]
  for = "/index.html"
  values = { Cache-Control = "public, max-age=0, must-revalidate" }

[[redirects]]
  from = "/empresa"
  to = "/#hero"
  status = 301

[[redirects]]
  from = "/servicios"
  to = "/#capabilities"
  status = 301

[[redirects]]
  from = "/proyectos"
  to = "/#projects"
  status = 301

[[redirects]]
  from = "/flota"
  to = "/#fleet"
  status = 301

[[redirects]]
  from = "/equipo"
  to = "/#team"
  status = 301

[[redirects]]
  from = "/contacto"
  to = "/#contact"
  status = 301

[[redirects]]
  from = "/clientes"
  to = "/#clients"
  status = 301

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = { Role = ["admin"] }

# Edge Functions para headers dinámicos si necesario
